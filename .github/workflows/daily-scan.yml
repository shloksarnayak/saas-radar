name: Daily SaaS Opportunity Scan

on:
  schedule:
    # Runs 07:00 UTC daily (~12:30 PM IST) — edit the cron string to change the time
    - cron: "0 7 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit data/seen.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO_ADDRESS: ${{ secrets.DIGEST_TO_ADDRESS }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}  # optional, blank is fine
        run: python main.py

      - name: Commit updated opportunity store
        run: |
          git config user.name "saas-radar-bot"
          git config user.email "actions@github.com"
          git add data/seen.json
          git diff --quiet --cached || git commit -m "Update seen opportunities [skip ci]"
          git push
